spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/razorpay-db}
    username: ${DB_USER:admin}
    password: ${DB_PASS:password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_POST:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  service:
    master-key: a019mna123gaplmer17834mce9qp10h4

payment:
  simulator:
    poll-interval-ms: 500000000
    chaos-mode: NORMAL
    methods:
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 90
      NETBANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 90
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 4
        success-rate: 90


jwt:
  secret-key: hiuhuihihiujiabcdefgkjnjnhijlmnopqrstuvwxyz109

app:
  rate-limit:
    method: bucket
    use-case:
      api-key:
        requests-per-minute: 2
